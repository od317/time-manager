<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9FA1FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B5BAFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" />
  
  <!-- Clock face -->
  <circle cx="50" cy="50" r="35" fill="white" stroke="#7C7ED8" stroke-width="2" />
  
  <!-- Clock hands -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="#7C7ED8" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="50" x2="65" y2="40" stroke="#7C7ED8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#7C7ED8" />
  
  <!-- Hour markers -->
  <line x1="50" y1="18" x2="50" y2="22" stroke="#B5BAFF" stroke-width="2" />
  <line x1="50" y1="78" x2="50" y2="82" stroke="#B5BAFF" stroke-width="2" />
  <line x1="18" y1="50" x2="22" y2="50" stroke="#B5BAFF" stroke-width="2" />
  <line x1="78" y1="50" x2="82" y2="50" stroke="#B5BAFF" stroke-width="2" />
</svg>